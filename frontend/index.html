<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PeakAerobic" />
    <meta name="description" content="PeakAerobic — Del test de lactato al plan de entrenamiento, automatizado. Análisis fisiológico, prescripción de mesociclos y seguimiento para coaches de triatlón y running." />
    <meta name="keywords" content="lactate threshold analysis, training zones, triathlon coaching software, running coach platform, INSCYD alternative, lactate test interpretation, mesocycle planning, VO2max analysis" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PeakAerobic — Análisis de lactato y planificación para coaches" />
    <meta property="og:description" content="La única plataforma que cierra el ciclo completo: test, análisis fisiológico, prescripción de mesociclos y seguimiento." />
    <meta property="og:site_name" content="PeakAerobic" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PeakAerobic — Del test de lactato al plan de entrenamiento" />
    <meta name="twitter:description" content="Análisis de lactato automatizado, zonas dinámicas y prescripción de mesociclos para coaches." />
    <link rel="canonical" href="https://peakAerobic.com/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>PeakAerobic — Análisis de lactato y planificación para coaches</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PeakAerobic",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "description": "Plataforma de análisis de lactato y planificación de entrenamiento para coaches de triatlón y running.",
      "offers": {
        "@type": "AggregateOffer",
        "lowPrice": "29",
        "highPrice": "99",
        "priceCurrency": "USD",
        "offerCount": "3"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px;">
      <img src="/app-icon.png" alt="PeakAerobic" width="96" height="96" style="border-radius:22px;" />
      <p style="font-family:'Source Sans 3',sans-serif;font-size:14px;margin:0;">Cargando...</p>
    </div>
    <style>
      #app-loader { background: #fff; color: #5e6d72; }
      @media (prefers-color-scheme: dark) { #app-loader { background: #0C0C14; color: #888; } }
    </style>
    <script>
      // Remove loader once React mounts
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const loader = document.getElementById('app-loader');
          if (loader) { loader.style.opacity = '0'; loader.style.transition = 'opacity 0.3s'; setTimeout(() => loader.remove(), 300); }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
