databases:
  - name: lactate-lab-db
    plan: free
    databaseName: lactate_lab
    user: lactate_lab

services:
  - type: web
    name: lactate-lab-api
    runtime: python
    plan: standard
    rootDir: backend
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: bash -lc 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-max-requests 1000'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: lactate-lab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_BASE_URL
        value: https://lactate-lab-self.vercel.app
      - key: CORS_ORIGINS
        value: https://lactate-lab-self.vercel.app,https://peakaerobic.com,https://www.peakaerobic.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_TOKEN_ENCRYPTION_KEY
        sync: false
